version: '3.8'

services:
  # Infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: learnhub_identity,learnhub_courses,learnhub_enrollments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infrastructure/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh

  # Microservices
  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.API/Dockerfile
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=learnhub_identity;Username=postgres;Password=postgres
      - Jwt__Secret=LearnHubSuperSecretKey2024!@#$%^&*()
      - Jwt__Issuer=LearnHub
      - Jwt__Audience=LearnHub
      - RabbitMQ__Host=rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  course-api:
    build:
      context: .
      dockerfile: src/Services/Course/Course.API/Dockerfile
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=learnhub_courses;Username=postgres;Password=postgres
      - Jwt__Secret=LearnHubSuperSecretKey2024!@#$%^&*()
      - Jwt__Issuer=LearnHub
      - Jwt__Audience=LearnHub
      - RabbitMQ__Host=rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  enrollment-api:
    build:
      context: .
      dockerfile: src/Services/Enrollment/Enrollment.API/Dockerfile
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=learnhub_enrollments;Username=postgres;Password=postgres
      - Jwt__Secret=LearnHubSuperSecretKey2024!@#$%^&*()
      - Jwt__Issuer=LearnHub
      - Jwt__Audience=LearnHub
      - RabbitMQ__Host=rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  media-api:
    build:
      context: .
      dockerfile: src/Services/Media/Media.API/Dockerfile
    ports:
      - "5004:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AWS__ServiceURL=http://localstack:4566
      - AWS__BucketName=learnhub-media
      - Jwt__Secret=LearnHubSuperSecretKey2024!@#$%^&*()
      - Jwt__Issuer=LearnHub
      - Jwt__Audience=LearnHub
      - RabbitMQ__Host=rabbitmq
    depends_on:
      - localstack
      - rabbitmq

  api-gateway:
    build:
      context: .
      dockerfile: src/Gateway/ApiGateway/Dockerfile
    ports:
      - "5000:80"
    depends_on:
      - identity-api
      - course-api
      - enrollment-api
      - media-api

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:80
      - NEXT_PUBLIC_API_BROWSER_URL=http://localhost:5000
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  localstack_data:
