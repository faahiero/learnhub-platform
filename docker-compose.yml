version: '3.8'

services:
  # Infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: learnhub_identity,learnhub_courses,learnhub_enrollments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  floci:
    image: floci/floci:latest-compat
    ports:
      - "4566:4566"
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - FLOCI_SERVICES_UI_ENABLED=false
    volumes:
      - floci_data:/var/lib/floci
      - ./infrastructure/floci/init-floci.sh:/etc/floci/init/ready.d/init-floci.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_floci/health || curl -fsS http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  floci-ui:
    image: floci/floci-ui:latest
    ports:
      - "4500:4500"
    environment:
      - FLOCI_ENDPOINT=http://floci:4566
      - AWS_ENDPOINT_URL=http://floci:4566
      - FLOCI_HOSTNAME=floci
      - FLOCI_CLOUD=aws
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - PORT=4500
    depends_on:
      floci:
        condition: service_healthy

  # Microservices
  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.API/Dockerfile
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=learnhub_identity;Username=postgres;Password=postgres
      - Jwt__Secret=LearnHubSuperSecretKey2024!@#$%^&*()
      - Jwt__Issuer=LearnHub
      - Jwt__Audience=LearnHub
      - AWS__ServiceURL=http://floci:4566
    depends_on:
      postgres:
        condition: service_healthy
      floci:
        condition: service_healthy

  course-api:
    build:
      context: .
      dockerfile: src/Services/Course/Course.API/Dockerfile
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=learnhub_courses;Username=postgres;Password=postgres
      - Jwt__Secret=LearnHubSuperSecretKey2024!@#$%^&*()
      - Jwt__Issuer=LearnHub
      - Jwt__Audience=LearnHub
      - AWS__ServiceURL=http://floci:4566
    depends_on:
      postgres:
        condition: service_healthy
      floci:
        condition: service_healthy

  enrollment-api:
    build:
      context: .
      dockerfile: src/Services/Enrollment/Enrollment.API/Dockerfile
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=learnhub_enrollments;Username=postgres;Password=postgres
      - Jwt__Secret=LearnHubSuperSecretKey2024!@#$%^&*()
      - Jwt__Issuer=LearnHub
      - Jwt__Audience=LearnHub
      - AWS__ServiceURL=http://floci:4566
    depends_on:
      postgres:
        condition: service_healthy
      floci:
        condition: service_healthy

  media-api:
    build:
      context: .
      dockerfile: src/Services/Media/Media.API/Dockerfile
    ports:
      - "5004:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AWS__ServiceURL=http://floci:4566
      - AWS__PublicServiceURL=http://localhost:4566
      - AWS__BucketName=learnhub-media
      - Jwt__Secret=LearnHubSuperSecretKey2024!@#$%^&*()
      - Jwt__Issuer=LearnHub
      - Jwt__Audience=LearnHub
    depends_on:
      floci:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: src/Gateway/ApiGateway/Dockerfile
    ports:
      - "5000:80"
      - "5005:80"
    depends_on:
      floci:
        condition: service_healthy
      identity-api:
        condition: service_started
      course-api:
        condition: service_started
      enrollment-api:
        condition: service_started
      media-api:
        condition: service_started

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_GATEWAY_URL=http://api-gateway:80
      - FLOCI_URL=http://floci:4566
      - NEXT_PUBLIC_API_URL=http://api-gateway:80
      - NEXT_PUBLIC_API_BROWSER_URL=
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  floci_data:
